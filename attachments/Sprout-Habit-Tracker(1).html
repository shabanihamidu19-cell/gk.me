            insights.push({
              emoji: '🔥',
              text: `Consistency ya <strong>${overall} siku</strong>. Endelea hivyo.`
            });
          }
        }

        if (insights.length) {
          html += `<div class="section-title">Habit insights</div>`;
          html += insights.map(i => `
            <div class="insight-card">
              <div class="emoji">${i.emoji}</div>
              <div class="text">${i.text}</div>
            </div>
          `).join('');
        }

        el.innerHTML = html;

        document.getElementById('st-log-btn')?.addEventListener('click', () => Forms.showScreenTimeLog());
        document.getElementById('st-focus-btn')?.addEventListener('click', () => Forms.showFocusTimer());
        document.getElementById('st-goal-btn')?.addEventListener('click', () => Forms.showScreenTimeGoal());
      },

      settings() {
        const el = document.getElementById('settings-content');
        const habitCount = State.get().habits.length;
        const completionCount = State.get().completions.length;
        const reflectionCount = State.get().reflections.length;

        el.innerHTML = `
          <div class="section-title">Your data</div>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px">
            ${habitCount} habit${habitCount !== 1 ? 's' : ''} · ${completionCount} check-in${completionCount !== 1 ? 's' : ''} · ${reflectionCount} reflection${reflectionCount !== 1 ? 's' : ''}
          </p>
          <div class="settings-list">
            <button class="settings-item" id="set-export">
              <div class="left">
                <span>📤</span>
                <span>Export data</span>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button class="settings-item" id="set-import">
              <div class="left">
                <span>📥</span>
                <span>Import backup</span>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button class="settings-item" id="set-clear">
              <div class="left">
                <span>🗑️</span>
                <span>Clear all data</span>
              </div>
            </button>
          </div>
          <div class="section-title mt-16">About</div>
          <p style="margin-top:8px;font-size:0.8rem;color:var(--text-muted);text-align:center;line-height:1.6">
            Sprout stores everything locally on your device.<br>
            No accounts. No tracking. Progress over perfection.
          </p>
          <p style="margin-top:12px;font-size:0.75rem;color:var(--text-muted);text-align:center">v1.0 · Single-file · Offline-first</p>
        `;

        document.getElementById('set-export').addEventListener('click', () => Forms.showExportSheet());
        document.getElementById('set-import').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'application/json,.json';
          input.onchange = () => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              if (Storage.import(reader.result)) {
                UI.toast('Backup restored');
                Render.today();
                Render.progress();
                Render.goals();
                Render.insights();
                Render.settings();
              } else {
                UI.toast('Invalid backup file');
              }
            };
            reader.readAsText(file);
          };
          input.click();
        });

        document.getElementById('set-clear').addEventListener('click', () => {
          if (confirm('Delete ALL habits, completions, goals, and reflections? This cannot be undone.')) {
            Storage.clear();
            State.replace(Storage.normalize({}));
            UI.toast('All data cleared');
            Render.today();
            Render.progress();
            Render.goals();
            Render.insights();
            Render.settings();
          }
        });
      }
    };

    // ═══════════════════════════════════════════════════════════
    // FORMS
    // ═══════════════════════════════════════════════════════════
    const Forms = {
      showHabitForm(existing) {
        const isEdit = !!existing;
        const h = existing || {
          name: '',
          icon: '🌱',
          color: COLORS[0],
          why: '',
          minimumVersion: '',
          frequency: { type: 'daily' },
          preferredTime: ''
        };
        const freq = h.frequency || { type: 'daily' };

        UI.openSheet(`
          <h2 id="sheet-title">${isEdit ? 'Edit habit' : 'New habit'}</h2>
          <div class="form-group">
            <label for="h-name">Name</label>
            <input id="h-name" type="text" placeholder="e.g. Study JavaScript" value="${escapeHtml(h.name)}" maxlength="60" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="h-why">Why? (optional)</label>
            <input id="h-why" type="text" placeholder="I want to become a better developer" value="${escapeHtml(h.why || '')}" maxlength="120" />
          </div>
          <div class="form-group">
            <label for="h-min">Minimum version (optional)</label>
            <input id="h-min" type="text" placeholder="Study for 10 minutes" value="${escapeHtml(h.minimumVersion || '')}" maxlength="80" />
          </div>
          <div class="form-group">
            <label>Icon</label>
            <div class="icon-picker" id="h-icons">
              ${ICONS.map(ic => `<button type="button" class="icon-opt ${ic === (h.icon || '🌱') ? 'selected' : ''}" data-icon="${ic}">${ic}</button>`).join('')}
            </div>
          </div>
          <div class="form-group">
            <label>Color</label>
            <div class="color-picker" id="h-colors">
              ${COLORS.map(c => `<button type="button" class="color-swatch ${c === h.color ? 'selected' : ''}" data-color="${c}" style="background:${c}"></button>`).join('')}
            </div>
          </div>
          <div class="form-group">
            <label>Frequency</label>
            <div class="freq-options" id="h-freq">
              ${FREQ_TYPES.map(f => `<button type="button" class="freq-chip ${f.id === freq.type ? 'selected' : ''}" data-freq="${f.id}">${f.label}</button>`).join('')}
            </div>
          </div>
          <div class="form-group ${freq.type === 'custom' ? '' : 'hidden'}" id="h-days-group">
            <label>Days</label>
            <div class="day-chips" id="h-days">
              ${DAY_NAMES.map((n, i) => `<button type="button" class="day-chip ${(freq.days || []).includes(i) ? 'selected' : ''}" data-day="${i}">${n.charAt(0)}</button>`).join('')}
            </div>
          </div>
          <div class="form-group ${freq.type === 'xtimes' ? '' : 'hidden'}" id="h-times-group">
            <label for="h-times">Times per week</label>
            <input id="h-times" type="number" min="1" max="7" value="${freq.times || 3}" />
          </div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="h-cancel">Cancel</button>
            <button class="btn btn-primary" id="h-save">${isEdit ? 'Save' : 'Create'}</button>
          </div>
        `);

        let selectedIcon = h.icon || '🌱';
        let selectedColor = h.color || COLORS[0];
        let selectedFreq = freq.type || 'daily';
        let selectedDays = [...(freq.days || [])];

        document.querySelectorAll('#h-icons .icon-opt').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#h-icons .icon-opt').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedIcon = btn.dataset.icon;
          });
        });
        document.querySelectorAll('#h-colors .color-swatch').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#h-colors .color-swatch').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedColor = btn.dataset.color;
          });
        });
        document.querySelectorAll('#h-freq .freq-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#h-freq .freq-chip').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedFreq = btn.dataset.freq;
            document.getElementById('h-days-group').classList.toggle('hidden', selectedFreq !== 'custom');
            document.getElementById('h-times-group').classList.toggle('hidden', selectedFreq !== 'xtimes');
          });
        });
        document.querySelectorAll('#h-days .day-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            const day = Number(btn.dataset.day);
            if (selectedDays.includes(day)) {
              selectedDays = selectedDays.filter(d => d !== day);
              btn.classList.remove('selected');
            } else {
              selectedDays.push(day);
              btn.classList.add('selected');
            }
          });
        });

        document.getElementById('h-cancel').addEventListener('click', () => UI.closeSheet());
        document.getElementById('h-save').addEventListener('click', () => {
          const name = document.getElementById('h-name').value.trim();
          if (!name) {
            UI.toast('Please enter a name');
            document.getElementById('h-name').focus();
            return;
          }
          const frequency = { type: selectedFreq };
          if (selectedFreq === 'custom') {
            if (selectedDays.length === 0) {
              UI.toast('Select at least one day');
              return;
            }
            frequency.days = selectedDays.sort((a, b) => a - b);
          }
          if (selectedFreq === 'xtimes') {
            frequency.times = Math.min(7, Math.max(1, Number(document.getElementById('h-times').value) || 3));
          }
          if (selectedFreq === 'weekly') {
            frequency.preferredDay = 0;
          }

          if (isEdit) {
            State.updateHabit(h.id, {
              name,
              icon: selectedIcon,
              color: selectedColor,
              why: document.getElementById('h-why').value.trim(),
              minimumVersion: document.getElementById('h-min').value.trim(),
              frequency
            });
            UI.toast('Habit updated');
          } else {
            State.addHabit({
              id: uid(),
              name,
              icon: selectedIcon,
              color: selectedColor,
              why: document.getElementById('h-why').value.trim(),
              minimumVersion: document.getElementById('h-min').value.trim(),
              frequency,
              preferredTime: '',
              createdAt: new Date().toISOString(),
              archivedAt: null,
              updatedAt: new Date().toISOString()
            });
            UI.toast('Habit created');
          }
          UI.closeSheet();
          Render.today();
          Render.progress();
        });
      },

      showGoalForm(existing) {
        const isEdit = !!existing;
        const g = existing || { title: '', description: '', habitIds: [] };
        const habits = State.getActiveHabits();

        UI.openSheet(`
          <h2 id="sheet-title">${isEdit ? 'Edit goal' : 'New goal'}</h2>
          <div class="form-group">
            <label for="g-title">Title</label>
            <input id="g-title" type="text" placeholder="Become a better developer" value="${escapeHtml(g.title)}" maxlength="80" />
          </div>
          <div class="form-group">
            <label for="g-desc">Description (optional)</label>
            <textarea id="g-desc" placeholder="What does success look like?" maxlength="200">${escapeHtml(g.description || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Link habits</label>
            <div id="g-habits" style="display:flex;flex-direction:column;gap:8px">
              ${habits.length === 0
                ? '<p style="color:var(--text-muted);font-size:0.85rem">Create habits first, then link them here.</p>'
                : habits.map(h => `
                  <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px;background:var(--bg-card);border-radius:8px">
                    <input type="checkbox" value="${h.id}" ${(g.habitIds || []).includes(h.id) ? 'checked' : ''} style="width:auto" />
                    <span>${h.icon || '🌱'} ${escapeHtml(h.name)}</span>
                  </label>
                `).join('')}
            </div>
          </div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="g-cancel">Cancel</button>
            <button class="btn btn-primary" id="g-save">${isEdit ? 'Save' : 'Create'}</button>
          </div>
        `);

        document.getElementById('g-cancel').addEventListener('click', () => UI.closeSheet());
        document.getElementById('g-save').addEventListener('click', () => {
          const title = document.getElementById('g-title').value.trim();
          if (!title) {
            UI.toast('Please enter a title');
            return;
          }
          const habitIds = Array.from(document.querySelectorAll('#g-habits input:checked')).map(i => i.value);
          if (isEdit) {
            State.updateGoal(g.id, {
              title,
              description: document.getElementById('g-desc').value.trim(),
              habitIds
            });
            UI.toast('Goal updated');
          } else {
            State.addGoal({
              id: uid(),
              title,
              description: document.getElementById('g-desc').value.trim(),
              habitIds,
              createdAt: new Date().toISOString()
            });
            UI.toast('Goal created');
          }
          UI.closeSheet();
          Render.goals();
        });
      },

      showScreenTimeLog() {
        const today = DateUtil.today();
        const existing = State.getScreenTime(today) || {
          totalMinutes: '',
          social: '',
          entertainment: '',
          productivity: '',
          note: ''
        };

        UI.openSheet(`
          <h2 id="sheet-title">Log screen time</h2>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px">
            Fungua <strong>Settings → Screen Time / Digital Wellbeing</strong>, soma total, kisha weka hapa.
          </p>
          <div class="form-group">
            <label for="st-total">Jumla (dakika)</label>
            <input id="st-total" type="number" min="0" max="1440" placeholder="e.g. 245" value="${existing.totalMinutes !== '' && existing.totalMinutes != null ? existing.totalMinutes : ''}" />
            <p style="font-size:0.75rem;color:var(--text-muted);margin-top:6px">Mfano: 2h 30m = 150 dakika</p>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="st-social">Social (optional)</label>
              <input id="st-social" type="number" min="0" placeholder="min" value="${existing.social || ''}" />
            </div>
            <div class="form-group">
              <label for="st-ent">Entertainment</label>
              <input id="st-ent" type="number" min="0" placeholder="min" value="${existing.entertainment || ''}" />
            </div>
          </div>
          <div class="form-group">
            <label for="st-note">Note (optional)</label>
            <input id="st-note" type="text" placeholder="e.g. Siku ya kazi" value="${escapeHtml(existing.note || '')}" maxlength="80" />
          </div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="st-cancel">Cancel</button>
            <button class="btn btn-primary" id="st-save">Save</button>
          </div>
        `);

        document.getElementById('st-cancel').addEventListener('click', () => UI.closeSheet());
        document.getElementById('st-save').addEventListener('click', () => {
          const total = Number(document.getElementById('st-total').value);
          if (isNaN(total) || total < 0) {
            UI.toast('Weka dakika sahihi');
            return;
          }
          State.saveScreenTime({
            date: today,
            totalMinutes: Math.round(total),
            social: Number(document.getElementById('st-social').value) || null,
            entertainment: Number(document.getElementById('st-ent').value) || null,
            note: document.getElementById('st-note').value.trim(),
            loggedAt: new Date().toISOString()
          });
          UI.closeSheet();
          UI.toast('Screen time imehifadhiwa');
          Render.insights();
        });
      },

      showScreenTimeGoal() {
        const goal = State.get().settings.screenTimeGoalMin || 180;
        UI.openSheet(`
          <h2 id="sheet-title">Screen time goal</h2>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px">
            Lengo la juu la muda wa skrini kwa siku (dakika).
          </p>
          <div class="form-group">
            <label for="st-goal">Dakika / siku</label>
            <input id="st-goal" type="number" min="30" max="1440" value="${goal}" />
            <p style="font-size:0.75rem;color:var(--text-muted);margin-top:6px">Sasa: ${formatMinutes(goal)} · Mfano: 3h = 180</p>
          </div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="sg-cancel">Cancel</button>
            <button class="btn btn-primary" id="sg-save">Save goal</button>
          </div>
        `);
        document.getElementById('sg-cancel').addEventListener('click', () => UI.closeSheet());
        document.getElementById('sg-save').addEventListener('click', () => {
          State.setScreenTimeGoal(document.getElementById('st-goal').value);
          UI.closeSheet();
          UI.toast('Goal imesasishwa');
          Render.insights();
        });
      },

      showFocusTimer() {
        let remaining = 25 * 60;
        let totalChosen = 25 * 60;
        let timerId = null;
        let running = false;

        const renderDisplay = () => {
          const m = Math.floor(remaining / 60);
          const s = remaining % 60;
          const el = document.getElementById('focus-display');
          if (el) el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const stopTimer = () => {
          if (timerId) clearInterval(timerId);
          timerId = null;
          running = false;
          const btn = document.getElementById('focus-toggle');
          if (btn) btn.textContent = 'Start';
        };

        UI.openSheet(`
          <h2 id="sheet-title">Focus session</h2>
          <div class="focus-presets" id="focus-presets">
            <button type="button" data-min="15">15m</button>
            <button type="button" data-min="25" class="active">25m</button>
            <button type="button" data-min="45">45m</button>
            <button type="button" data-min="60">60m</button>
          </div>
          <div class="focus-timer-display" id="focus-display">25:00</div>
          <div class="sheet-actions" style="flex-direction:column;gap:10px">
            <button class="btn btn-primary btn-block" id="focus-toggle">Start</button>
            <button class="btn btn-secondary btn-block" id="focus-done">Hifadhi & funga</button>
            <button class="btn btn-ghost btn-block" id="focus-cancel">Cancel</button>
          </div>
        `);

        document.querySelectorAll('#focus-presets button').forEach(btn => {
          btn.addEventListener('click', () => {
            if (running) return;
            document.querySelectorAll('#focus-presets button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mins = Number(btn.dataset.min);
            totalChosen = mins * 60;
            remaining = totalChosen;
            renderDisplay();
          });
        });

        document.getElementById('focus-toggle').addEventListener('click', () => {
          if (running) {
            stopTimer();
            return;
          }
          running = true;
          document.getElementById('focus-toggle').textContent = 'Pause';
          timerId = setInterval(() => {
            remaining--;
            renderDisplay();
            if (remaining <= 0) {
              stopTimer();
              remaining = 0;
              renderDisplay();
              UI.toast('Focus imeisha — vizuri!');
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
          }, 1000);
        });

        document.getElementById('focus-done').addEventListener('click', () => {
          stopTimer();
          const elapsed = Math.round((totalChosen - remaining) / 60);
          if (elapsed >= 1) {
            State.addFocusSession({
              id: uid(),
              date: DateUtil.today(),
              minutes: elapsed,
              plannedMinutes: Math.round(totalChosen / 60),
              completedAt: new Date().toISOString()
            });
            UI.toast(`Focus: ${elapsed} dakika`);
          }
          UI.closeSheet();
          Render.insights();
        });

        document.getElementById('focus-cancel').addEventListener('click', () => {
          stopTimer();
          UI.closeSheet();
        });
      },

      showExportSheet() {
        const today = DateUtil.today();
        const habitCount = State.get().habits.length;
        const completionCount = State.get().completions.length;
        const reflectionCount = State.get().reflections.length;

        UI.openSheet(`
          <h2 id="sheet-title">Export data</h2>
          <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:20px">
            Download a copy of your progress. Full backups can be imported later on any device.
          </p>

          <button class="settings-item" id="ex-json" style="width:100%;margin-bottom:8px;text-align:left">
            <div class="left">
              <span>💾</span>
              <div>
                <div style="font-weight:600">Full backup (JSON)</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">${habitCount} habits · ${completionCount} check-ins · ${reflectionCount} reflections</div>
              </div>
            </div>
          </button>

          <button class="settings-item" id="ex-habits" style="width:100%;margin-bottom:8px;text-align:left">
            <div class="left">
              <span>📋</span>
              <div>
                <div style="font-weight:600">Habits (CSV)</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">Open in spreadsheets</div>
              </div>
            </div>
          </button>

          <button class="settings-item" id="ex-completions" style="width:100%;margin-bottom:8px;text-align:left">
            <div class="left">
              <span>✅</span>
              <div>
                <div style="font-weight:600">Check-ins (CSV)</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">${completionCount} rows</div>
              </div>
            </div>
          </button>

          <button class="settings-item" id="ex-reflections" style="width:100%;margin-bottom:8px;text-align:left">
            <div class="left">
              <span>🪞</span>
              <div>
                <div style="font-weight:600">Reflections (CSV)</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">${reflectionCount} rows</div>
              </div>
            </div>
          </button>

          <div class="sheet-actions" style="margin-top:20px">
            <button class="btn btn-secondary btn-block" id="ex-close">Close</button>
          </div>
        `);

        document.getElementById('ex-json').addEventListener('click', () => {
          Storage.download(
            `sprout-backup-${today}.json`,
            Storage.exportJSON(),
            'application/json'
          );
          UI.toast('Backup downloaded');
        });
        document.getElementById('ex-habits').addEventListener('click', () => {
          Storage.download(
            `sprout-habits-${today}.csv`,
            Storage.exportHabitsCSV(),
            'text/csv;charset=utf-8'
          );
          UI.toast('Habits CSV downloaded');
        });
        document.getElementById('ex-completions').addEventListener('click', () => {
          Storage.download(
            `sprout-checkins-${today}.csv`,
            Storage.exportCompletionsCSV(),
            'text/csv;charset=utf-8'
          );
          UI.toast('Check-ins CSV downloaded');
        });
        document.getElementById('ex-reflections').addEventListener('click', () => {
          Storage.download(
            `sprout-reflections-${today}.csv`,
            Storage.exportReflectionsCSV(),
            'text/csv;charset=utf-8'
          );
          UI.toast('Reflections CSV downloaded');
        });
        document.getElementById('ex-close').addEventListener('click', () => UI.closeSheet());
      },

      showReflection() {
        const today = DateUtil.today();
        const existing = State.getReflection(today) || { mood: null, wentWell: '', proud: '', improve: '' };

        UI.openSheet(`
          <h2 id="sheet-title">How was today?</h2>
          <div class="mood-picker" id="mood-picker" role="group" aria-label="Mood">
            ${MOODS.map((m, i) => `
              <button type="button" class="mood-btn ${existing.mood === i ? 'selected' : ''}" data-mood="${i}" aria-label="${m.label}">${m.emoji}</button>
            `).join('')}
          </div>
          <div class="form-group">
            <label for="r-well">What went well?</label>
            <textarea id="r-well" placeholder="Optional">${escapeHtml(existing.wentWell || '')}</textarea>
          </div>
          <div class="form-group">
            <label for="r-proud">What am I proud of?</label>
            <textarea id="r-proud" placeholder="Optional">${escapeHtml(existing.proud || '')}</textarea>
          </div>
          <div class="form-group">
            <label for="r-improve">What do I want to improve tomorrow?</label>
            <textarea id="r-improve" placeholder="Optional">${escapeHtml(existing.improve || '')}</textarea>
          </div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="r-cancel">Cancel</button>
            <button class="btn btn-primary" id="r-save">Save</button>
          </div>
        `);

        let selectedMood = existing.mood;
        document.querySelectorAll('#mood-picker .mood-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#mood-picker .mood-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedMood = Number(btn.dataset.mood);
          });
        });

        document.getElementById('r-cancel').addEventListener('click', () => UI.closeSheet());
        document.getElementById('r-save').addEventListener('click', () => {
          State.saveReflection({
            date: today,
            mood: selectedMood,
            wentWell: document.getElementById('r-well').value.trim(),
            proud: document.getElementById('r-proud').value.trim(),
            improve: document.getElementById('r-improve').value.trim()
          });
          UI.closeSheet();
          UI.toast('Reflection saved');
        });
      }
    };

    // ═══════════════════════════════════════════════════════════
    // EVENTS & INIT
    // ═══════════════════════════════════════════════════════════
    function bindGlobal() {
      // Nav
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => UI.switchView(btn.dataset.view));
      });

      // FAB
      document.getElementById('fab-add').addEventListener('click', () => {
        const active = document.querySelector('.view.active');
        if (active && active.id === 'view-goals') {
          Forms.showGoalForm();
        } else {
          Forms.showHabitForm();
        }
      });

      // Reflect
      document.getElementById('btn-reflect').addEventListener('click', () => Forms.showReflection());

      // Screen time log from header
      document.getElementById('btn-log-screentime')?.addEventListener('click', () => Forms.showScreenTimeLog());

      // Overlay close
      document.getElementById('overlay').addEventListener('click', e => {
        if (e.target.id === 'overlay') UI.closeSheet();
      });

      // Escape closes sheet
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') UI.closeSheet();
      });
    }

    function init() {
      State.init();
      bindGlobal();
      Render.today();
      // Pre-warm other views lightly
      document.getElementById('fab-add').style.display = 'flex';
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
